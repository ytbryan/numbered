name: Release

# Pushing a version tag, such as 0.2.0, builds the signed APK and drafts its GitHub release.
# The tag must match numberedVersion in gradle.properties. Publishing the draft stays a person's call.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # A release is built from scratch, never from a cache another run could have written.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Check the tag matches the app version
        run: python3 scripts/check_release_artifact.py tag "$GITHUB_REF_NAME"

      - name: Restore the signing key
        env:
          NUMBERED_KEYSTORE_BASE64: ${{ secrets.NUMBERED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NUMBERED_KEYSTORE_BASE64" ]; then
            echo "::error::Add the NUMBERED_KEYSTORE_BASE64 secret. See Releasing in the README."
            exit 1
          fi
          printf '%s' "$NUMBERED_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint, and build the signed release
        env:
          ORG_GRADLE_PROJECT_numberedKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_numberedKeystorePassword: ${{ secrets.NUMBERED_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_numberedKeyAlias: ${{ secrets.NUMBERED_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_numberedKeyPassword: ${{ secrets.NUMBERED_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check release security boundaries
        run: |
          python3 scripts/check_release_security.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      # Only an APK signed with the key of earlier releases can update installed copies.
      - name: Check the APK's signature and version
        run: python3 scripts/check_release_artifact.py apk app/build/outputs/apk/release/app-release.apk "$GITHUB_REF_NAME"

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="numbered-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --draft --verify-tag --title "v$GITHUB_REF_NAME" \
            --notes "Requires Android 8 or later. Download the APK on your Android phone and open it to install.

          Built from commit $GITHUB_SHA. The APK's SHA-256 is in $apk.sha256."
