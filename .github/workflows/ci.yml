name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Unit and screen tests, lint with warnings as errors, and the release build.
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Check release security boundaries
        run: |
          python3 scripts/check_release_security.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      # Room regenerates the exported schema on every build, so a schema change must be committed.
      - name: Check the exported database schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            echo "::error::The Room schema changed. Bump the database version, add a migration, and commit app/schemas."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/screens/
            app/build/reports/
          if-no-files-found: ignore
